name: Compile IETF Internet-Drafts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    permissions:
      contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4.2.2

    - name: Set up Ruby environment
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Set up Python environment
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Install IETF Authoring Tools
      run: |
        gem install kramdown-rfc2629
        pip install xml2rfc

    - name: Compile Drafts via Makefile
      run: |
        make

    - name: Deploy Compiled Files to Latest Release
      if: github.ref == 'refs/heads/main' # Only upload to the release page on main branch pushes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete the old continuous tracking tag if it already exists
        gh release delete latest --yes || true
        git tag -d latest || true
        git push origin :refs/tags/latest || true
        
        # Create a fresh, highly visible release entry containing your raw drafts
        gh release create latest \
          --title "Latest Compiled Internet-Drafts" \
          --notes "Automated compilation generated from commit: ${{ github.sha }}" \
          bgp-source-selective-attr/*.txt \
          bgp-source-selective-attr/*.html \
          source-selective-bgp-framework/*.txt \
          source-selective-bgp-framework/*.html

