name: Compile IETF Internet-Drafts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    permissions:
      contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4.2.2

    - name: Set up Ruby environment
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Set up Python environment
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Install IETF Authoring Tools
      run: |
        gem install kramdown-rfc2629
        pip install xml2rfc

    - name: Compile Drafts via Makefile
      run: |
        make

    - name: Organize Deployment Folder Structure
      if: github.ref == 'refs/heads/main'
      run: |
        # Build the container routing folder
        mkdir -p public
        
        # Copy compiled assets into place
        cp bgp-source-selective-attr/*.html public/attr.html
        cp bgp-source-selective-attr/*.txt public/attr.txt
        cp source-selective-bgp-framework/*.html public/framework.html
        cp source-selective-bgp-framework/*.txt public/framework.txt
        
        # Write a simple home dashboard file
        cat << 'EOF' > public/index.html
        <!DOCTYPE html>
        <html>
        <head><title>IETF Source-Selective BGP Drafts</title></head>
        <body>
          <h1>Latest Compiled Internet-Drafts</h1>
          <ul>
            <li><strong>BGP Source-Selective Attribute:</strong> 
                <a href="attr.html">View HTML Draft</a> | <a href="attr.txt">View Text Draft</a></li>
            <li><strong>Source-Selective BGP Framework:</strong> 
                <a href="framework.html">View HTML Draft</a> | <a href="framework.txt">View Text Draft</a></li>
          </ul>
        </body>
        </html>
        EOF

    - name: Upload Pages Package Artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

    - name: Deploy Pages Site to Internet
      if: github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v4


